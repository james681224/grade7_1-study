<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國一上 國文科段考複習、互動圖解與測驗（翰林版）</title>
<style>
  :root {
    --primary: #2e7d32;
    --secondary: #f57c00;
    --accent: #00897b;
    --bg: #f1f8e9;
    --text: #2c3e50;
  }
  body { font-family: -apple-system, 'Microsoft JhengHei', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; line-height: 1.6; }
  .container { max-width: 960px; margin: 0 auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #e0e0e0; padding-bottom: 12px; margin-bottom: 15px; }
  .home-btn { background: #607d8b; color: white; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 14px; transition: 0.2s; }
  .home-btn:hover { background: #455a64; }
  h1 { color: var(--primary); margin: 0; font-size: 24px; }
  .scope-box { background: #fff8e1; border: 2px solid #ffe082; border-radius: 12px; padding: 15px; margin-bottom: 20px; }
  .scope-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .scope-title { font-weight: bold; color: #e65100; font-size: 16px; }
  .quick-btns button { background: white; border: 1px solid #ffb74d; color: #e65100; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 4px; font-weight: bold; }
  .quick-btns button:hover { background: #ffe0b2; }
  .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 8px; }
  .lesson-label { display: flex; align-items: center; background: white; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 14px; font-weight: 500; user-select: none; }
  .lesson-label input { margin-right: 8px; transform: scale(1.2); accent-color: var(--primary); }
  .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab-btn { flex: 1; min-width: 150px; padding: 12px 10px; font-size: 17px; border: none; border-radius: 10px; background: #e0e0e0; color: #555; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 3px 10px rgba(46,125,50,0.25); }
  .tab-btn#tab-anim.active { background: var(--accent); box-shadow: 0 3px 10px rgba(0,137,123,0.25); }
  .section { display: none; }
  .section.active { display: block; }
  
  /* 重點整理卡片 */
  .note-card { border: 1px solid #c8e6c9; border-left: 6px solid var(--primary); border-radius: 10px; padding: 16px; margin-bottom: 16px; background: #fafafa; }
  .note-title { font-size: 19px; font-weight: bold; color: var(--primary); margin-bottom: 8px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .note-tag { font-size: 13px; background: #e8f5e9; color: #2e7d32; padding: 2px 10px; border-radius: 12px; }
  .note-list { margin: 0; padding-left: 20px; }
  .note-list li { margin-bottom: 6px; font-size: 15px; }
  .highlight { color: #d84315; font-weight: bold; }

  /* 互動視覺動畫卡片 */
  .anim-card {
    border: 2px solid #b2dfdb;
    border-left: 6px solid var(--accent);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
  }
  .anim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .anim-title {
    font-size: 19px;
    font-weight: bold;
    color: #00695c;
  }
  .anim-badge {
    background: #e0f2f1;
    color: #00695c;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
  }
  .svg-stage {
    width: 100%;
    background: #f8fafc;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    text-align: center;
  }
  .svg-stage svg {
    width: 100%;
    max-width: 680px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    background: #eceff1;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .ctrl-btn {
    background: #fff;
    border: 2px solid var(--accent);
    color: #00695c;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    background: var(--accent);
    color: #fff;
  }
  .concept-callout {
    background: #fff8e1;
    border: 1px solid #ffe082;
    border-left: 5px solid #ffa000;
    border-radius: 8px;
    padding: 12px 15px;
    font-size: 15px;
    color: #4e342e;
    line-height: 1.6;
  }
  .concept-callout b { color: #e65100; }

  @keyframes twinkle {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }
  .star-twinkle { animation: twinkle 2s infinite ease-in-out; transform-origin: center; }

  /* 測驗區 */
  .quiz-box { background: #f9fbe7; border: 2px solid #c5e1a5; border-radius: 14px; padding: 25px 20px; max-width: 720px; margin: 0 auto; }
  .score-bar { display: flex; justify-content: space-between; font-weight: bold; color: #33691e; margin-bottom: 15px; font-size: 16px; background: #e8f5e9; padding: 10px 15px; border-radius: 8px; }
  .q-tag { display: inline-block; background: var(--secondary); color: white; padding: 3px 10px; border-radius: 12px; font-size: 13px; margin-bottom: 10px; font-weight: bold; }
  .q-text { font-size: 19px; font-weight: bold; margin-bottom: 18px; color: #1b5e20; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .opt-btn { text-align: left; padding: 12px 16px; font-size: 16px; border: 2px solid #ccc; background: white; border-radius: 10px; cursor: pointer; transition: 0.15s; font-weight: 500; }
  .opt-btn:hover { border-color: var(--primary); background: #f1f8e9; }
  .opt-btn.correct { background: #c8e6c9; border-color: #2e7d32; color: #1b5e20; font-weight: bold; }
  .opt-btn.wrong { background: #ffcdd2; border-color: #c62828; color: #b71c1c; }
  .exp-box { margin-top: 18px; padding: 15px; background: #fff3e0; border-left: 5px solid #ff9800; border-radius: 8px; display: none; font-size: 15px; }
  .next-btn { background: var(--primary); color: white; border: none; padding: 12px 28px; font-size: 17px; border-radius: 25px; cursor: pointer; margin-top: 15px; font-weight: bold; display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1>📖 國一上 國文科（翰林版）</h1>
    <a href="index.html" class="home-btn">🏠 回大廳選科目</a>
  </div>

  <!-- 範圍勾選器 -->
  <div class="scope-box">
    <div class="scope-header">
      <span class="scope-title">📌 勾選本次段考範圍（考哪幾課就勾哪幾課）：</span>
      <div class="quick-btns">
        <button onclick="selectRange([1,2,3,'c1'])">一段(1~3課)</button>
        <button onclick="selectRange([4,5,6,'c2'])">二段(4~6課)</button>
        <button onclick="selectRange([7,8,9,10])">三段(7~10課)</button>
        <button onclick="selectAll(true)">全選</button>
      </div>
    </div>
    <div class="lesson-grid" id="lesson-checkboxes"></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-notes" onclick="switchTab('notes')">📚 考前重點速覽</button>
    <button class="tab-btn" id="tab-anim" onclick="switchTab('anim')">🎬 互動圖解與文意動畫</button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">✍️ 範圍無限刷題測驗</button>
  </div>

  <!-- 重點整理分頁 -->
  <div id="sec-notes" class="section active"></div>

  <!-- 互動動畫分頁 -->
  <div id="sec-anim" class="section"></div>

  <!-- 測驗分頁 -->
  <div id="sec-quiz" class="section">
    <div class="quiz-box">
      <div class="score-bar">
        <span>✅ 已答對：<span id="correct-cnt">0</span> 題</span>
        <span>🔥 連續答對：<span id="streak-cnt">0</span> 題</span>
      </div>
      <div id="quiz-area">
        <span class="q-tag" id="q-lesson-tag">第一課</span>
        <div class="q-text" id="q-text">題目載入中...</div>
        <div class="options" id="q-options"></div>
        <div class="exp-box" id="q-exp"></div>
        <div style="text-align:center;">
          <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">下一題 ➡️</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const lessons = [
  { id: 1, name: '第1課：夏夜' },

  { id: 6, name: '第6課：心囚' },

  btn.classList.add('active');
}

function initCheckboxes() {
  const grid = document.getElementById('lesson-checkboxes');
  lessons.forEach(l => {
    const label = document.createElement('label');
    label.className = 'lesson-label';
    const checked = selectedLessons.has(l.id) ? 'checked' : '';
    label.innerHTML = `<input type="checkbox" value="${l.id}" ${checked} onchange="toggleLesson('${l.id}')"> ${l.name}`;
    grid.appendChild(label);
  });
  renderNotesAndAnims();
}

function toggleLesson(id) {
  const key = isNaN(id) ? id : Number(id);
  if (selectedLessons.has(key)) selectedLessons.delete(key);
  else selectedLessons.add(key);
  renderNotesAndAnims();
  if (document.getElementById('sec-quiz').classList.contains('active')) loadNextQuestion();
}

function selectRange(arr) {
  selectedLessons = new Set(arr);
  updateCheckboxesUI();
  renderNotesAndAnims();
  if (document.getElementById('sec-quiz').classList.contains('active')) loadNextQuestion();
}

function selectAll(flag) {
  selectedLessons = flag ? new Set(lessons.map(l => l.id)) : new Set();
  updateCheckboxesUI();
  renderNotesAndAnims();
  if (document.getElementById('sec-quiz').classList.contains('active')) loadNextQuestion();
}

function updateCheckboxesUI() {
  document.querySelectorAll('#lesson-checkboxes input').forEach(cb => {
    const key = isNaN(cb.value) ? cb.value : Number(cb.value);
    cb.checked = selectedLessons.has(key);
  });
}

function switchTab(tab) {
  document.getElementById('tab-notes').classList.toggle('active', tab === 'notes');
  document.getElementById('tab-anim').classList.toggle('active', tab === 'anim');
  document.getElementById('tab-quiz').classList.toggle('active', tab === 'quiz');
  document.getElementById('sec-notes').classList.toggle('active', tab === 'notes');
  document.getElementById('sec-anim').classList.toggle('active', tab === 'anim');
  document.getElementById('sec-quiz').classList.toggle('active', tab === 'quiz');
  if (tab === 'quiz') loadNextQuestion();
}

  if (selectedLessons.has(7)) setCn7(0, null);
  if (selectedLessons.has(8)) setCn8(0, null);
  if (selectedLessons.has(9)) setCn9(0, null);
  if (selectedLessons.has(10)) setCn10(0, null);
}

function loadNextQuestion() {
  answered = false;
  document.getElementById('q-exp').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  
  const pool = quizBank.filter(item => selectedLessons.has(item.l));
  if (pool.length === 0) {
    document.getElementById('q-text').innerText = '請先在上方勾選至少一個課次範圍，才能開始出題喔！';
    document.getElementById('q-options').innerHTML = '';
    return;
  }

  let nextQ;
  do {
    nextQ = pool[Math.floor(Math.random() * pool.length)];
  } while (pool.length > 1 && currentQ && nextQ.q === currentQ.q);
  currentQ = nextQ;

  const lessonObj = lessons.find(x => x.id === currentQ.l);
  document.getElementById('q-lesson-tag').innerText = lessonObj ? lessonObj.name : '綜合題';
  document.getElementById('q-text').innerText = currentQ.q;

  const optsWithIdx = currentQ.opts.map((text, idx) => ({ text, isAns: idx === currentQ.ans }));
  optsWithIdx.sort(() => Math.random() - 0.5);

  const optContainer = document.getElementById('q-options');
  optContainer.innerHTML = '';
  optsWithIdx.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerText = o.text;
    btn.onclick = () => checkAnswer(btn, o.isAns, optsWithIdx);
    optContainer.appendChild(btn);
  });
}

function checkAnswer(btn, isAns, allOpts) {
  if (answered) return;
  answered = true;
  const btns = document.querySelectorAll('.opt-btn');
  if (isAns) {
    btn.classList.add('correct');
    correctCount++;
    streakCount++;
  } else {
    btn.classList.add('wrong');
    streakCount = 0;
    btns.forEach((b, i) => {
      if (allOpts[i].isAns) b.classList.add('correct');
    });
  }
  document.getElementById('correct-cnt').innerText = correctCount;
  document.getElementById('streak-cnt').innerText = streakCount;
  
  const expBox = document.getElementById('q-exp');
  expBox.innerHTML = `<b>${isAns ? '🎉 答對了！' : '💡 觀念解析：'}</b>${currentQ.exp}`;
  expBox.style.display = 'block';
  document.getElementById('next-btn').style.display = 'inline-block';
}

initCheckboxes();
</script>
