<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國一上自然科學（翰林版）- 重點、互動實驗與無限刷題</title>
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #e8f5e9;
    --secondary: #00897b;
    --accent: #f57c00;
    --bg: #f1f8e9;
    --text: #263238;
    --border: #c8e6c9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .home-btn {
    text-decoration: none;
    background: #eceff1;
    color: #37474f;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    transition: 0.2s;
  }
  .home-btn:hover { background: #cfd8dc; }
  h1 {
    margin: 0;
    color: var(--primary);
    font-size: 24px;
  }
  .scope-box {
    background: var(--primary-light);
    border: 2px solid #a5d6a7;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .scope-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .scope-title {
    font-weight: bold;
    color: #1b5e20;
    font-size: 16px;
  }
  .quick-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .q-btn {
    background: #fff;
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }
  .q-btn:hover {
    background: var(--primary);
    color: #fff;
  }
  .chap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
  }
  .chap-item {
    display: flex;
    align-items: center;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #c8e6c9;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
  }
  .chap-item input {
    margin-right: 8px;
    width: 17px;
    height: 17px;
    accent-color: var(--primary);
  }
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1;
    min-width: 160px;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #e0e0e0;
    color: #555;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(46,125,50,0.3);
  }
  .tab-btn#tab-anim.active {
    background: var(--secondary);
    box-shadow: 0 3px 10px rgba(0,137,123,0.3);
  }
  .section { display: none; }
  .section.active { display: block; }

  /* 重點整理卡片 */
  .note-card {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    background: #fafafa;
  }
  .note-card h3 {
    margin: 0 0 10px 0;
    color: #1b5e20;
    font-size: 18px;
    border-left: 5px solid var(--primary);
    padding-left: 10px;
  }
  .note-list {
    margin: 0;
    padding-left: 20px;
  }
  .note-list li {
    margin-bottom: 8px;
    font-size: 15px;
  }
  .highlight {
    background: #fff9c4;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    color: #d84315;
  }
  .exp-box {
    background: #e0f2f1;
    border-left: 4px solid #00897b;
    padding: 10px 14px;
    margin-top: 10px;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }

  /* 互動實驗與觀念動畫卡片 */
  .anim-card {
    border: 2px solid #b2dfdb;
    border-left: 6px solid var(--secondary);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
  }
  .anim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .anim-title {
    font-size: 19px;
    font-weight: bold;
    color: #00695c;
  }
  .anim-badge {
    background: #e0f2f1;
    color: #00695c;
    padding: 4px 12px;
    border-radius: 15px;
    font-size: 13px;
    font-weight: bold;
  }
  .svg-stage {
    width: 100%;
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    text-align: center;
  }
  .svg-stage svg {
    width: 100%;
    max-width: 680px;
    height: auto;
    display: block;
    margin: 0 auto;
  }
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    justify-content: center;
    background: #f1f5f9;
    padding: 10px 14px;
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .ctrl-btn {
    background: #ffffff;
    border: 2px solid var(--secondary);
    color: #00695c;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .ctrl-btn:hover, .ctrl-btn.active {
    background: var(--secondary);
    color: #ffffff;
  }
  .concept-callout {
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-left: 5px solid #f59e0b;
    border-radius: 8px;
    padding: 12px 15px;
    font-size: 15px;
    color: #78350f;
    line-height: 1.6;
  }
  .concept-callout b { color: #b45309; }

  /* 測驗區 */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff3e0;
    border: 2px solid #ffcc80;
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stats {
    font-weight: bold;
    font-size: 16px;
    color: #e65100;
  }
  .quiz-card {
    border: 2px solid #b2dfdb;
    border-radius: 14px;
    padding: 24px;
    background: #fff;
  }
  .q-tag {
    display: inline-block;
    background: var(--secondary);
    color: #fff;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #1a237e;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .opt-btn {
    text-align: left;
    padding: 14px 18px;
    font-size: 17px;
    border: 2px solid #cfd8dc;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: 0.15s;
    font-weight: 500;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .opt-btn.correct {
    background: #c8e6c9;
    border-color: #2e7d32;
    color: #1b5e20;
    font-weight: bold;
  }
  .opt-btn.wrong {
    background: #ffcdd2;
    border-color: #c62828;
    color: #b71c1c;
  }
  .explain-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #fffde7;
    border: 2px solid #fbc02d;
    font-size: 16px;
  }
  .explain-title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .next-btn {
    margin-top: 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 24px;
    cursor: pointer;
    display: none;
  }
  .next-btn:hover { background: #1b5e20; }
  .empty-warn {
    text-align: center;
    padding: 30px;
    color: #d32f2f;
    font-weight: bold;
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1>🔬 國一上自然科學（翰林版）</h1>
    <a href="index.html" class="home-btn">🏠 回全科總目錄</a>
  </div>

  <!-- 範圍勾選器 -->
  <div class="scope-box">
    <div class="scope-header">
      <span class="scope-title">📌 勾選本次段考範圍（可複選）：</span>
      <div class="quick-btns">
        <button class="q-btn" onclick="selectPreset([1,2])">一段 (第1~2章)</button>
        <button class="q-btn" onclick="selectPreset([3,4])">二段 (第3~4章)</button>
        <button class="q-btn" onclick="selectPreset([5,6])">三段 (第5~6章)</button>
        <button class="q-btn" onclick="selectPreset([1,2,3,4,5,6])">全冊總複習</button>
      </div>
    </div>
    <div class="chap-grid" id="chap-checkboxes"></div>
  </div>

  <!-- 分頁按鈕 -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-notes" onclick="switchTab('notes')">📖 考前重點與實驗整理</button>
    <button class="tab-btn" id="tab-anim" onclick="switchTab('anim')">🎬 互動實驗與觀念動畫</button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">✍️ 範圍無限刷題測驗</button>
  </div>

  <!-- 分頁一：重點整理 -->
  <div id="sec-notes" class="section active"></div>

  <!-- 分頁二：互動實驗與觀念動畫 -->
  <div id="sec-anim" class="section"></div>

  <!-- 分頁三：無限測驗 -->
  <div id="sec-quiz" class="section">
    <div class="quiz-header">
      <div class="stats">🏆 總得分：<span id="score">0</span> 分 ｜ 🔥 連續答對：<span id="streak">0</span> 題</div>
      <div style="font-size:14px; color:#555;">💡 題目與選項皆自動隨機變化</div>
    </div>
    <div id="quiz-area"></div>
  </div>
</div>

<script>
const chapters = [
  {
    id: 1,
    title: "第1章 生命世界與科學方法",
    notes: [
      "<b>生命現象四大特徵</b>：<span class='highlight'>代謝</span>（能量轉換與廢物排出）、<span class='highlight'>生長</span>（細胞分裂與體積增大）、<span class='highlight'>感應</span>（對環境刺激產生反應）、<span class='highlight'>繁殖</span>（產生後代延續生命）。注意：鐘乳石變長、機器人說話「不是」生命現象。",
      "<b>生物圈範圍</b>：海平面上下各約 <span class='highlight'>10 公里</span>（共約 20 公里），包含水域、低層大氣與地表。",
      "<b>科學方法步驟</b>：觀察 ➔ 提出問題 ➔ 參考文獻 ➔ <span class='highlight'>提出假說</span> ➔ 設計實驗 ➔ 分析結果 ➔ 提出結論。",
      "<b>實驗變因口訣</b>：<span class='highlight'>操作變因</span>只能有 1 個（實驗組與對照組唯一不同的條件）；<span class='highlight'>控制變因</span>要全部保持相同；<span class='highlight'>應變變因</span>是實驗觀察測量的結果。"
    ],
    exp: "🧪 <b>實驗 1-1 顯微鏡使用重點</b>：① <b>複式顯微鏡</b>影像為「上下顛倒、左右相反」（例如看到 b 實際是 q；偏左上方要往左上方移才能移到中央）；② <b>解剖顯微鏡</b>影像與實物「方向相同」，具有立體感；③ 換高倍鏡時，視野會變暗、細胞變大、細胞數目變少，此時<b>只能轉動細調節輪</b>，絕對不可轉粗調節輪！"
  },
  {
    id: 2,
    title: "第2章 生物體的組成",
    notes: [
      "<b>細胞學說</b>：由虎克（發現細胞壁）及許萊登、許旺等人提出——<span class='highlight'>細胞是生物體構造與功能的基本單位</span>。",
      "<b>細胞構造口訣</b>：<span class='highlight'>細胞核</span>（生命中樞，含遺傳物質 DNA，無核則細胞逐漸死亡）、<span class='highlight'>細胞質</span>（代謝場所）、<span class='highlight'>細胞膜</span>（控制物質進出，稱為細胞的門戶）、<span class='highlight'>粒線體</span>（發電廠，行呼吸作用產生能量）。",
      "<b>動植物細胞差異</b>：植物細胞多出 <span class='highlight'>細胞壁</span>（支持保護，纖維素組成）、<span class='highlight'>葉綠體</span>（行光合作用，表皮細胞與根部細胞「沒有」葉綠體）、<span class='highlight'>大型液胞</span>。",
      "<b>物質進出細胞方式</b>：① <b>擴散作用</b>（高濃度 ➔ 低濃度，不耗能，如氧氣、二氧化碳）；② <b>滲透作用</b>（水分子通過細胞膜的擴散：紅血球放清水中會膨脹破裂，放濃食鹽水會萎縮；植物細胞因有細胞壁保護，放清水中不會破裂）；③ <b>蛋白質通道</b>（葡萄糖、胺基酸等較大分子需靠特殊蛋白質協助）。",
      "<b>生物體組成層次</b>：植物為「細胞 ➔ 組織 ➔ 器官 ➔ 植物體」（<span class='highlight'>植物沒有系統</span>）；動物為「細胞 ➔ 組織 ➔ 器官 ➔ 器官系統 ➔ 動物體」。"
    ],
    exp: "🧪 <b>實驗 2-1 細胞觀察</b>：觀察口腔皮膜細胞用<b>亞甲藍液</b>染色（細胞核變深藍，形狀不規則）；觀察洋蔥表皮細胞用<b>碘液</b>染色（細胞排列整齊、有細胞壁、無葉綠體）；保衛細胞呈半月形且<b>有葉綠體</b>。"
  },
  {
    id: 3,
    title: "第3章 生物體的營養",
    notes: [
      "<b>產生能量的三大養分</b>：醣類（4 大卡/克）、蛋白質（4 大卡/克）、脂質（9 大卡/克）。水、礦物質、維生素「不能」產生能量，但維持生理機能。",
      "<b>酵素（酶）特性</b>：主要成分為<span class='highlight'>蛋白質</span>；具有<span class='highlight'>專一性</span>（一種酵素只催化一種反應）；受溫度影響（低溫抑制活性但不破壞，高溫超過 60°C 會永久失去活性）；受酸鹼性影響（胃蛋白酶愛強酸，唾液澱粉酶愛中性，小腸酵素愛弱鹼）。",
      "<b>光合作用方程式</b>：水 ＋ 二氧化碳 ──(光能＋葉綠體)──▶ <span class='highlight'>葡萄糖 ＋ 氧氣 ＋ 水</span>。光反應在葉綠體中需要光能將水分解產生氧氣；碳反應（暗反應）利用能量將二氧化碳轉為葡萄糖。",
      "<b>人體消化系統</b>：消化管為「口腔 ➔ 咽 ➔ 食道 ➔ 胃 ➔ <span class='highlight'>小腸</span>（消化與吸收最主要場所，內壁有絨毛增加吸收面積）➔ 大腸（吸收剩餘水分）➔ 肛門」。<span class='highlight'>肝臟分泌膽汁</span>（不含酵素，只乳化脂質），儲存在膽囊。"
    ],
    exp: "🧪 <b>實驗 3-1 ＆ 3-3 測定重點</b>：① <b>碘液</b>測澱粉（黃褐色 ➔ 藍黑色）；② <b>本氏液</b>測葡萄糖（需<span class='highlight'>隔水加熱</span>，淡藍色 ➔ 綠、黃、橙、紅色）；③ 光合作用實驗葉片先水煮軟化，再放<b>酒精中隔水加熱</b>褪去葉綠素（酒精易燃不可直接加熱）。"
  },
  {
    id: 4,
    title: "第4章 生物體的運輸作用",
    notes: [
      "<b>植物維管束構造</b>：<span class='highlight'>木質部</span>（運輸水分與礦物質，只能由下往上單向運輸，老細胞形成木材）；<span class='highlight'>韌皮部</span>（運輸養分，可雙向運輸）。雙子葉植物（如向日葵、榕樹）維管束呈<span class='highlight'>環狀排列</span>且有<span class='highlight'>形成層</span>（可使莖加粗）；單子葉植物（如玉米、水稻）呈散生排列且無形成層。",
      "<b>水分上升主要動力</b>：<span class='highlight'>蒸散作用</span>（水分由葉片氣孔散失產生的拉力，是將水從根部拉到樹梢的最主要力量）。",
      "<b>人體血液組成</b>：① 血漿（90%是水，運載養分、廢物、抗體、激素）；② <span class='highlight'>紅血球</span>（無細胞核，含血紅素負責攜帶氧氣）；③ <span class='highlight'>白血球</span>（體積最大、有細胞核，吞噬病原體，發炎時數量大增）；④ <span class='highlight'>血小板</span>（體積最小、無細胞核，負責血液凝固）。",
      "<b>血管比較口訣</b>：管壁厚度「動脈 ＞ 靜脈 ＞ 微血管」；血流速度「動脈 ＞ 靜脈 ＞ 微血管」；血壓高低「動脈 ＞ 微血管 ＞ 靜脈」。<span class='highlight'>微血管</span>只有一層細胞厚，是物質交換場所；<span class='highlight'>靜脈</span>內有瓣膜防止血液逆流。"
    ],
    exp: "🧪 <b>實驗 4-2 探測心音與脈搏</b>：第一心音「撲」是房室瓣關閉，第二心音「通」是半月瓣關閉；脈搏是動脈隨心臟收縮而產生的搏動，因此正常情況下「心搏次數 ＝ 脈搏次數」。觀察小魚尾鰭時，紅血球單行通過的是微血管，小動脈血流向微血管，微血管匯流至小靜脈。"
  },
  {
    id: 5,

function toggleActiveBtn(btn) {
  if (!btn) return;
  btn.parentElement.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setS1(mode, btn) {
  toggleActiveBtn(btn);
  const r = document.getElementById('s1-real');
  const v = document.getElementById('s1-view');
  const tip = document.getElementById('s1-tip');
  if (mode === 0) {
    r.textContent = 'b'; v.textContent = 'q';
    r.setAttribute('x', '185'); v.setAttribute('x', '495');
    tip.innerHTML = '🔍 <b>成像規則</b>：複式顯微鏡看到的是旋轉 180° 的影像，「b」在視野中會變成「q」。';
  } else if (mode === 1) {
    r.textContent = 'pd'; v.textContent = 'pd';
    r.setAttribute('x', '185'); v.setAttribute('x', '495');
    tip.innerHTML = '🔍 <b>對稱字元</b>：「pd」旋轉 180° 後仍為「pd」，是段考常考的經典題型。';
  } else {
    r.textContent = 'b'; v.textContent = 'b';
    r.setAttribute('x', '155'); v.setAttribute('x', '525');
    tip.innerHTML = '🎯 <b>移動口訣</b>：視野中目標偏「右下方」，代表實際偏左上方，玻片要往「右下方」移才能移到中央。';
  }
}

  { chap: 3, q: "小明將唾液與澱粉液混合後，放進 100°C 的沸水中煮 10 分鐘，冷卻後加入碘液與本氏液測試，結果為何？", opts: ["碘液變藍黑色；本氏液維持淡藍色", "碘液維持黃褐色；本氏液變紅色", "兩者皆維持原色", "兩者皆變色"], ans: 0, exp: "唾液澱粉酶的主要成分是「蛋白質」，經過 100°C 高溫煮沸後會永久破壞失去活性，無法分解澱粉。因此澱粉還在（碘液變藍黑色），沒有產生葡萄糖（本氏液不變色，維持淡藍色）。" },

  { chap: 6, q: "鳥類與昆蟲為了適應陸地乾燥環境、減少水分散失，它們排出的含氮廢物主要形式為何？", opts: ["氨", "尿素", "尿酸", "胺基酸"], ans: 2, exp: "毒性大小：氨 ＞ 尿素 ＞ 尿酸。鳥類和昆蟲將含氮廢物轉成不溶於水的「尿酸」，混在糞便中排出，最節省水分。" },
  { chap: 6, q: "午餐吃完一碗大滷麵後，人體內的血糖濃度上升，此時體內會發生哪一種調節機制？", opts: ["升糖素分泌增加，將肝糖分解為葡萄糖", "胰島素分泌增加，促使細胞利用血糖並合成肝糖", "腎上腺素分泌增加，加速心跳", "甲狀腺素分泌減少，停止代謝"], ans: 1, exp: "飯後血糖高 ➔ 胰島素分泌增加，降低血糖並將多餘葡萄糖轉為「肝糖」儲存在肝臟與肌肉中。" },
  { chap: 6, q: "將剛萌芽的綠豆放入錐形瓶中密封 30 分鐘，再將瓶內氣體通入澄清石灰水中，會觀察到什麼現象？", opts: ["澄清石灰水變成白色混濁", "澄清石灰水變成粉紅色", "澄清石灰水變成藍黑色", "完全沒有任何變化"], ans: 0, exp: "萌芽綠豆呼吸作用旺盛，會釋放大量「二氧化碳」，二氧化碳通入澄清石灰水會產生白色碳酸鈣沉澱（變混濁）。" }
];

function generateDynamicQuestions() {
  const dyn = [];
  const eyeList = [5, 10, 15];
  const objList = [4, 10, 40, 60];
  const eye = eyeList[Math.floor(Math.random() * eyeList.length)];
  const obj = objList[Math.floor(Math.random() * objList.length)];
  const total = eye * obj;
  const wrong1 = eye + obj;
  const wrong2 = total * 10;
  const wrong3 = Math.max(10, total / 2);
  dyn.push({
    chap: 1,
    q: `【計算題】小美使用複式顯微鏡觀察水蘊草葉片，若目鏡標示為 ${eye}X，物鏡標示為 ${obj}X，則此時細胞被放大的總倍率為多少倍？`,
    opts: [`${total} 倍`, `${wrong1} 倍`, `${wrong2} 倍`, `${wrong3} 倍`],
    ans: 0,
    exp: `顯微鏡總放大倍率公式 ＝「目鏡倍率 × 物鏡倍率」。因此 ${eye} × ${obj} ＝ ${total} 倍（注意是用乘的，不是用加的喔！）。`
  });

  const carb = (Math.floor(Math.random() * 5) + 2) * 5;
  const prot = (Math.floor(Math.random() * 4) + 1) * 5;
  const fat = (Math.floor(Math.random() * 3) + 1) * 2;
  const kcal = carb * 4 + prot * 4 + fat * 9;
  const w1 = (carb + prot + fat) * 4;
  const w2 = carb * 9 + prot * 4 + fat * 4;
  const w3 = kcal + 20;
  dyn.push({
    chap: 3,
    q: `【計算題】某款牛奶的營養標示含有：醣類 ${carb} 公克、蛋白質 ${prot} 公克、脂質 ${fat} 公克、鈣質 200 毫克。請問喝完這瓶牛奶可獲得多少大卡的熱量？`,
    opts: [`${kcal} 大卡`, `${w1} 大卡`, `${w2} 大卡`, `${w3} 大卡`],
    ans: 0,
    exp: `熱量計算口訣：「醣類 4、蛋白質 4、脂質 9，礦物質（鈣質）0 熱量」。<br>算式：(${carb} × 4) ＋ (${prot} × 4) ＋ (${fat} × 9) ＝ ${carb*4} ＋ ${prot*4} ＋ ${fat*9} ＝ ${kcal} 大卡。`
  });

  return dyn;
}

let score = 0;
let streak = 0;
let currentQ = null;
let answered = false;

function initCheckboxes() {
  const container = document.getElementById("chap-checkboxes");
  chapters.forEach(c => {
    const label = document.createElement("label");
    label.className = "chap-item";
    label.innerHTML = `<input type="checkbox" value="${c.id}" checked onchange="onScopeChange()"> ${c.title}`;
    container.appendChild(label);
  });
}

function getSelectedChaps() {
  return Array.from(document.querySelectorAll("#chap-checkboxes input:checked")).map(cb => Number(cb.value));
}

function selectPreset(ids) {
  document.querySelectorAll("#chap-checkboxes input").forEach(cb => {
    cb.checked = ids.includes(Number(cb.value));
  });
  onScopeChange();
}

function onScopeChange() {
  renderNotesAndAnims();
  if (document.getElementById("sec-quiz").classList.contains("active")) {
    loadNextQuestion();
  }
}

function switchTab(tab) {
  document.getElementById("tab-notes").classList.toggle("active", tab === "notes");
  document.getElementById("tab-anim").classList.toggle("active", tab === "anim");
  document.getElementById("tab-quiz").classList.toggle("active", tab === "quiz");
  document.getElementById("sec-notes").classList.toggle("active", tab === "notes");
  document.getElementById("sec-anim").classList.toggle("active", tab === "anim");
  document.getElementById("sec-quiz").classList.toggle("active", tab === "quiz");
  if (tab === "quiz") {
    loadNextQuestion();
  }
}

function renderNotesAndAnims() {
  const selected = getSelectedChaps();
  const notesContainer = document.getElementById("sec-notes");
  const animContainer = document.getElementById("sec-anim");
  if (selected.length === 0) {
    const warn = `<div class="empty-warn">⚠️ 請先在上方勾選至少一個章節範圍喔！</div>`;
    notesContainer.innerHTML = warn;
    animContainer.innerHTML = warn;
    return;
  }

  let notesHtml = "";
  let animHtml = "";
  chapters.filter(c => selected.includes(c.id)).forEach(c => {
    const listItems = c.notes.map(n => `<li>${n}</li>`).join("");
    notesHtml += `
      <div class="note-card">
        <h3>${c.title}</h3>
        <ul class="note-list">${listItems}</ul>
        <div class="exp-box">${c.exp}</div>
      </div>
    `;

    if (animData[c.id]) {
      const a = animData[c.id];
      animHtml += `
        <div class="anim-card">
          <div class="anim-header">
            <div class="anim-title">🎬 ${a.title}</div>
            <span class="anim-badge">${a.badge}</span>
          </div>
          ${a.html}
        </div>
      `;
    }
  });
  notesContainer.innerHTML = notesHtml;
  animContainer.innerHTML = animHtml;

  if (selected.includes(1)) setS1(0, null);
  if (selected.includes(2)) setS2('normal', null);
  if (selected.includes(3)) setS3('opt', null);
  if (selected.includes(4)) setS4(0, null);
  if (selected.includes(5)) setS5(0, null);
  if (selected.includes(6)) setS6(0, null);
}

function loadNextQuestion() {
  const selected = getSelectedChaps();
  const area = document.getElementById("quiz-area");
  if (selected.length === 0) {
    area.innerHTML = `<div class="empty-warn">⚠️ 請先在上方勾選至少一個章節範圍，才能開始出題喔！</div>`;
    return;
  }

  answered = false;
  const pool = [...staticQuestions, ...generateDynamicQuestions()].filter(q => selected.includes(q.chap));

  let chosen;
  do {
    chosen = pool[Math.floor(Math.random() * pool.length)];
  } while (pool.length > 1 && currentQ && chosen.q === currentQ.q);
  currentQ = chosen;

  const chapObj = chapters.find(c => c.id === chosen.chap);
  const correctText = chosen.opts[chosen.ans];
  const shuffledOpts = [...chosen.opts].sort(() => Math.random() - 0.5);

  const optsHtml = shuffledOpts.map((optText, idx) => {
    const isCorrect = (optText === correctText);
    return `<button class="opt-btn" onclick="checkAnswer(this, ${isCorrect}, '${correctText.replace(/'/g, "\\'")}')">${["A", "B", "C", "D"][idx]}. ${optText}</button>`;
  }).join("");

  area.innerHTML = `
    <div class="quiz-card">
      <div class="q-tag">${chapObj ? chapObj.title : ""}</div>
      <div class="q-text">${chosen.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="explain-box" id="explain-box">
        <div class="explain-title" id="explain-title"></div>
        <div id="explain-text">${chosen.exp}</div>
      </div>
      <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">下一題 ➡️</button>
    </div>
  `;
}

function checkAnswer(btn, isCorrect, correctText) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll(".opt-btn");
  if (isCorrect) {
    btn.classList.add("correct");
    score += 10;
    streak += 1;
    document.getElementById("explain-title").style.color = "#2e7d32";
    document.getElementById("explain-title").innerText = "🎉 答對了！觀念非常清楚！";
  } else {
    btn.classList.add("wrong");
    streak = 0;
    document.getElementById("explain-title").style.color = "#c62828";
    document.getElementById("explain-title").innerText = `💡 差一點！正確答案是：【${correctText}】`;
    allBtns.forEach(b => {
      if (b.innerText.includes(correctText)) {
        b.classList.add("correct");
      }
    });
  }

  allBtns.forEach(b => b.disabled = true);
  document.getElementById("score").innerText = score;
  document.getElementById("streak").innerText = streak;
  document.getElementById("explain-box").style.display = "block";
  document.getElementById("next-btn").style.display = "inline-block";
}

initCheckboxes();
renderNotesAndAnims();
</script>
</body>
</html>
