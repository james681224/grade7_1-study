<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國一上自然科學（翰林版）- 段考重點、互動動畫與無限刷題</title>
<style>
  :root {
    --primary: #2e7d32;
    --primary-light: #e8f5e9;
    --secondary: #00897b;
    --accent: #f57c00;
    --bg: #f1f8e9;
    --text: #263238;
    --border: #c8e6c9;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
    line-height: 1.6;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 24px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .home-btn {
    text-decoration: none;
    background: #eceff1;
    color: #37474f;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    transition: 0.2s;
  }
  .home-btn:hover { background: #cfd8dc; }
  h1 {
    margin: 0;
    color: var(--primary);
    font-size: 24px;
  }
  .scope-box {
    background: var(--primary-light);
    border: 2px solid #a5d6a7;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .scope-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .scope-title {
    font-weight: bold;
    color: #1b5e20;
    font-size: 16px;
  }
  .quick-btns {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .q-btn {
    background: #fff;
    border: 1px solid var(--primary);
    color: var(--primary);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 13px;
    cursor: pointer;
    font-weight: bold;
  }
  .q-btn:hover {
    background: var(--primary);
    color: #fff;
  }
  .chap-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
  }
  .chap-item {
    display: flex;
    align-items: center;
    background: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid #c8e6c9;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
  }
  .chap-item input {
    margin-right: 8px;
    width: 17px;
    height: 17px;
    accent-color: var(--primary);
  }
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .tab-btn {
    flex: 1;
    min-width: 180px;
    padding: 14px 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #e0e0e0;
    color: #555;
    cursor: pointer;
    transition: 0.2s;
  }
  .tab-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 3px 10px rgba(46,125,50,0.3);
  }
  .section { display: none; }
  .section.active { display: block; }

  /* 重點整理卡片 */
  .note-card {
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 16px;
    background: #fafafa;
  }
  .note-card h3 {
    margin: 0 0 10px 0;
    color: #1b5e20;
    font-size: 18px;
    border-left: 5px solid var(--primary);
    padding-left: 10px;
  }
  .note-list {
    margin: 0;
    padding-left: 20px;
  }
  .note-list li {
    margin-bottom: 8px;
    font-size: 15px;
  }
  .highlight {
    background: #fff9c4;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: bold;
    color: #d84315;
  }
  .exp-box {
    background: #e0f2f1;
    border-left: 4px solid #00897b;
    padding: 10px 14px;
    margin-top: 10px;
    border-radius: 0 8px 8px 0;
    font-size: 14px;
  }

  /* 互動動畫模擬器樣式 */
  .sim-card {
    border: 2px solid #80cbc4;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 22px;
    background: #ffffff;
    box-shadow: 0 3px 12px rgba(0,137,123,0.08);
  }
  .sim-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
    border-bottom: 2px dashed #e0f2f1;
    padding-bottom: 10px;
  }
  .sim-title {
    font-size: 19px;
    font-weight: bold;
    color: #00695c;
    margin: 0;
  }
  .sim-badge {
    background: #e0f2f1;
    color: #00695c;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: bold;
  }
  .sim-stage {
    background: #f8fafc;
    border: 1px solid #cfd8dc;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .sim-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }
  .sim-btn {
    background: #fff;
    border: 2px solid var(--secondary);
    color: var(--secondary);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.15s;
  }
  .sim-btn:hover, .sim-btn.active {
    background: var(--secondary);
    color: #fff;
  }
  .sim-info {
    background: #fffde7;
    border-left: 4px solid #fbc02d;
    padding: 12px 14px;
    border-radius: 0 8px 8px 0;
    font-size: 15px;
    color: #37474f;
  }
  @keyframes dashFlow {
    to { stroke-dashoffset: -24; }
  }
  .flow-line {
    stroke-dasharray: 8 4;
    animation: dashFlow 0.8s linear infinite;
  }

  /* 測驗區 */
  .quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #fff3e0;
    border: 2px solid #ffcc80;
    padding: 12px 18px;
    border-radius: 12px;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .stats {
    font-weight: bold;
    font-size: 16px;
    color: #e65100;
  }
  .quiz-card {
    border: 2px solid #b2dfdb;
    border-radius: 14px;
    padding: 24px;
    background: #fff;
  }
  .q-tag {
    display: inline-block;
    background: var(--secondary);
    color: #fff;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 12px;
  }
  .q-text {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #1a237e;
  }
  .options {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .opt-btn {
    text-align: left;
    padding: 14px 18px;
    font-size: 17px;
    border: 2px solid #cfd8dc;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    transition: 0.15s;
    font-weight: 500;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--primary);
    background: var(--primary-light);
  }
  .opt-btn.correct {
    background: #c8e6c9;
    border-color: #2e7d32;
    color: #1b5e20;
    font-weight: bold;
  }
  .opt-btn.wrong {
    background: #ffcdd2;
    border-color: #c62828;
    color: #b71c1c;
  }
  .explain-box {
    display: none;
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #fffde7;
    border: 2px solid #fbc02d;
    font-size: 16px;
  }
  .explain-title {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
  }
  .next-btn {
    margin-top: 18px;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 24px;
    cursor: pointer;
    display: none;
  }
  .next-btn:hover { background: #1b5e20; }
  .empty-warn {
    text-align: center;
    padding: 30px;
    color: #d32f2f;
    font-weight: bold;
    font-size: 18px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="top-bar">
    <h1>🔬 國一上自然科學（翰林版）</h1>
    <a href="index.html" class="home-btn">🏠 回全科總目錄</a>
  </div>

  <!-- 範圍勾選器 -->
  <div class="scope-box">
    <div class="scope-header">
      <span class="scope-title">📌 勾選本次段考範圍（可複選）：</span>
      <div class="quick-btns">
        <button class="q-btn" onclick="selectPreset([1,2])">一段 (第1~2章)</button>
        <button class="q-btn" onclick="selectPreset([3,4])">二段 (第3~4章)</button>
        <button class="q-btn" onclick="selectPreset([5,6])">三段 (第5~6章)</button>
        <button class="q-btn" onclick="selectPreset([1,2,3,4,5,6])">全冊總複習</button>
      </div>
    </div>
    <div class="chap-grid" id="chap-checkboxes"></div>
  </div>

  <!-- 分頁按鈕 -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-notes" onclick="switchTab('notes')">📖 考前重點與實驗整理</button>
    <button class="tab-btn" id="tab-anim" onclick="switchTab('anim')">🎬 互動實驗與觀念動畫</button>
    <button class="tab-btn" id="tab-quiz" onclick="switchTab('quiz')">✍️ 範圍無限刷題測驗</button>
  </div>

  <!-- 分頁一：重點整理 -->
  <div id="sec-notes" class="section active"></div>

  <!-- 分頁二：互動動畫模擬器 -->
  <div id="sec-anim" class="section"></div>

  <!-- 分頁三：無限測驗 -->
  <div id="sec-quiz" class="section">
    <div class="quiz-header">
      <div class="stats">🏆 總得分：<span id="score">0</span> 分 ｜ 🔥 連續答對：<span id="streak">0</span> 題</div>
      <div style="font-size:14px; color:#555;">💡 題目與選項皆自動隨機變化</div>
    </div>
    <div id="quiz-area"></div>
  </div>
</div>

<script>
const chapters = [
  {
    id: 1,
    title: "第1章 生命世界與科學方法",
    notes: [
      "<b>生命現象四大特徵</b>：<span class='highlight'>代謝</span>（能量轉換與廢物排出）、<span class='highlight'>生長</span>（細胞分裂與體積增大）、<span class='highlight'>感應</span>（對環境刺激產生反應）、<span class='highlight'>繁殖</span>（產生後代延續生命）。注意：鐘乳石變長、機器人說話「不是」生命現象。",
      "<b>生物圈範圍</b>：海平面上下各約 <span class='highlight'>10 公里</span>（共約 20 公里），包含水域、低層大氣與地表。",
      "<b>科學方法步驟</b>：觀察 ➔ 提出問題 ➔ 參考文獻 ➔ <span class='highlight'>提出假說</span> ➔ 設計實驗 ➔ 分析結果 ➔ 提出結論。",
      "<b>實驗變因口訣</b>：<span class='highlight'>操作變因</span>只能有 1 個（實驗組與對照組唯一不同的條件）；<span class='highlight'>控制變因</span>要全部保持相同；<span class='highlight'>應變變因</span>是實驗觀察測量的結果。"
    ],
